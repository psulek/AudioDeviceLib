name: Publish NuGet

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, e.g. 1.0.0'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    environment: release
    permissions:
      id-token: write   # required: lets the job mint the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # The unit tests multi-target net48 / net7.0-windows / net8.0-windows. The net7 leg is
          # what exercises the shipped netstandard2.0 asset, so it needs a 7.0 runtime; the test
          # project also sets RollForward as a fallback.
          dotnet-version: 7.0.x

      # Gate the release on the tests. Tests run before Pack so a tag that fails publishes nothing.
      # An explicit project path, never a forward-slash glob: `dotnet` does not expand those on a
      # Windows runner (see the Push step below for the same lesson).
      - name: Test
        run: dotnet test Library.UnitTests/Library.UnitTests.csproj -c Release --logger "trx;LogFileName=test-results.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"   # v1.2.3 -> 1.2.3
          fi

      - name: Pack
        run: dotnet pack Library/AudioDeviceLib.csproj -c Release -p:Version=${{ steps.ver.outputs.version }} -o artifacts

      - name: NuGet login (OIDC -> short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Resolve the package with PowerShell rather than handing a wildcard to `dotnet nuget push`:
      # on Windows it does not expand a forward-slash glob and fails with "File does not exist".
      # Pushing the .nupkg also uploads the matching .snupkg sitting beside it.
      - name: Push
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path artifacts -File | Where-Object { $_.Extension -eq '.nupkg' }
          if (-not $packages) {
            throw "No .nupkg found in artifacts"
          }
          foreach ($pkg in $packages) {
            Write-Host "Pushing $($pkg.Name)"
            dotnet nuget push $pkg.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet nuget push failed for $($pkg.Name)"
            }
          }
