name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# `contents: read` is enough. dorny/test-reporter runs in its `use-actions-summary` mode, which
# writes to the job summary and makes no API calls - the `checks: write` its README asks for is
# only needed for the check-run mode, which a forked PR cannot use anyway.
permissions:
  contents: read

# Deliberately no `environment:` here. The `release` environment admits only `v*` tags, so naming it
# from a branch or PR run would be rejected. This job publishes nothing and needs no id-token.
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Build the whole solution and run the tests. Coverage is deliberately off: the CI machine has
      # no audio hardware, so the ~200 hardware-dependent tests skip, and the resulting number would
      # understate real coverage and mislead. Shared steps live in the composite action.
      - name: Build, test and quality
        uses: ./.github/actions/build-test
        with:
          run-build: 'true'
