name: CI

on:
  push:
    # `gh` is temporary: it exists so workflow changes can be exercised before they reach main.
    # Drop it from this list once that is done.
    branches: [ main, gh ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Deliberately no `environment:` here. The `release` environment admits only `v*` tags, so naming it
# from a branch or PR run would be rejected. This job publishes nothing and needs no id-token.
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          # Runtime for the net7.0-windows test leg, which is what exercises the shipped
          # netstandard2.0 asset.
          dotnet-version: 7.0.x

      - name: Build
        run: dotnet build AudioDeviceLib.slnx -c Release

      - name: Test
        run: dotnet test Library.UnitTests/Library.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results
